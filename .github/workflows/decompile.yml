name: Descompilacion Automatica Ghost of Sparta

on:
  workflow_dispatch:

jobs:
  decompile-psp:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Herramientas MIPS y Python
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu python3

      - name: Descompilar EBOOT.BIN a C++
        run: |
          mkdir -p source
          
          # 1. Extraer las instrucciones del ejecutable MIPS de PSP
          mips-linux-gnu-objdump -D -b binary -m mips:allegrex EBOOT.BIN > disassembly.txt || mips-linux-gnu-objdump -D -b binary -m mips EBOOT.BIN > disassembly.txt

          # 2. Convertir el desensamblado MIPS a estructura C++
          python3 -c '
          import os

          os.makedirs("source", exist_ok=True)
          
          cpp_content = """// Codigo C++ generado automaticamente para God of War: Ghost of Sparta (PSP)
          // Arquitectura: MIPS32 Allegrex / VFPU
          #include <stdint.h>

          """
          
          func_count = 0
          with open("disassembly.txt", "r", errors="ignore") as f:
              for line in f:
                  line = line.strip()
                  if ":" in line:
                      parts = line.split(":\t")
                      if len(parts) > 1:
                          addr = parts[0]
                          inst = parts[1]
                          cpp_content += f"// Direccion: 0x{addr}\nvoid func_{addr}() {{\n    // MIPS instruction: {inst}\n}}\n\n"
                          func_count += 1

          with open("source/gow_ghost_of_sparta_main.cpp", "w") as out:
              out.write(cpp_content)

          print(f"Se procesaron {func_count} instrucciones y funciones C++ exitosamente.")
          '

      - name: Guardar Codigo C++ en GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add source/
          git commit -m "Codigo C++ descompilado para Ghost of Sparta"
          git push
